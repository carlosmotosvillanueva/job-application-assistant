<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Application Assistant</title>
<style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#172033}h1{color:#173b82}label{display:block;margin-top:14px;font-weight:600}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin-top:6px;border:1px solid #bcc6d6;border-radius:6px;font:inherit}textarea{min-height:180px}button{margin-top:18px;background:#173b82;color:white;border:0;border-radius:6px;padding:12px 18px;font-weight:700;cursor:pointer}.card{background:#f4f7fb;padding:18px;margin-top:24px;border-radius:8px;white-space:pre-wrap}.muted{color:#586579}</style></head>
<body><h1>Job Application Assistant</h1><p class="muted">Busca ofertas, analízalas y prepara el CV y la carta adecuados. El envío siempre requiere revisión manual.</p>
<section class="card"><h2>Buscar ofertas</h2><p>Escribe tu búsqueda y abre resultados filtrados por portal.</p><label>Puesto o tecnología<input id="searchTerm" placeholder="Java Spring Boot"></label><label>Ubicación<input id="searchLocation" placeholder="Madrid o remoto"></label><button type="button" id="searchButton">Buscar en portales</button><div id="searchLinks"></div></section>
<form id="form"><label>Empresa<input id="company" required></label><label>Puesto<input id="title" required></label><label>URL de la oferta<input id="url"></label><label>Idioma<select id="language"><option value="">Detectar automáticamente</option><option value="es">Español</option><option value="en">Inglés</option></select></label><label>Descripción de la oferta<textarea id="description" required></textarea></label><button>Analizar oferta</button></form><div id="result"></div>
<script>searchButton.addEventListener('click',()=>{const q=encodeURIComponent(searchTerm.value.trim()+' '+searchLocation.value.trim());if(!searchTerm.value.trim()){searchLinks.innerHTML='<p>Escribe un puesto o tecnología.</p>';return}const links=[['LinkedIn','https://www.linkedin.com/jobs/search/?keywords='+q],['InfoJobs','https://www.infojobs.net/jobsearch/search-results/list.xhtml?keyword='+q],['Tecnoempleo','https://www.tecnoempleo.com/busqueda-empleo.php?tecnologia='+q],['Indeed','https://es.indeed.com/jobs?q='+q]];searchLinks.innerHTML='<p>'+links.map(([name,url])=>`<a href="${url}" target="_blank" rel="noopener">Abrir ${name}</a>`).join(' · ')+'</p>'});form.addEventListener('submit',async e=>{e.preventDefault();result.innerHTML='<p>Analizando…</p>';const r=await fetch('/api/offers/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company:company.value,title:title.value,url:url.value,language:language.value,description:description.value})});const d=await r.json();result.innerHTML=`<div class="card"><b>Idioma:</b> ${d.language}<br><b>CV recomendado:</b> ${d.cvVariant}<br><b>Enfoque:</b> ${d.matchSummary}<br><br><b>Carta:</b><br>${d.coverLetter}<br><br><b>Importante:</b> ${d.reviewNotice}</div>`})</script></body></html>
